<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field — preview</title></head>
<body>
<div id="root"></div>
<script>
var F=window.Folio,h=React.createElement;
function S(n,e,w){return h('div',{className:'fo-demo__cell',style:w?{gridColumn:'span '+w}:null},h('span',{className:'fo-demo__name'},n),e)}
function G(t,min){var c=[].slice.call(arguments,2);return h('section',{className:'fo-stack'},t&&h('h4',{className:'fo-demo__h'},t),h('div',{className:'fo-demo__grid',style:{'--_min':(min||200)+'px'}},c))}
function R(el){ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'fo fo-demo'},el))}
R(h('div',{className:'fo-demo__grid',style:{'--_min':'260px'}},
  S('Field / Default', h(F.Field,{label:'Child\'s first name',required:true},h(F.TextInput,{defaultValue:'Sarah'}))),
  S('Field / Helper', h(F.Field,{label:'Starting PACE number',helper:'Find it on the cover of the PACE booklet.'},h(F.NumberInput,{placeholder:'e.g. 1037'}))),
  S('Field / Optional', h(F.Field,{label:'Notes',optional:true},h(F.TextArea,{placeholder:'Anything to remember about today'}))),
  S('Field / Error', h(F.Field,{label:'PACE test score',error:'Enter a score from 0 to 100.'},h(F.ScoreInput,{defaultValue:'920'}))),
  S('Field / Warning', h(F.Field,{label:'PACE test score',warning:'Below the 80% pass mark. Sarah will repeat this PACE.'},h(F.ScoreInput,{defaultValue:'76'}))),
  S('Field / Success', h(F.Field,{label:'PACE test score',success:'Passed — 12 points above the pass mark.'},h(F.ScoreInput,{defaultValue:'92'})))
));
</script>
</body>
</html>
