<!doctype html>
<html>
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body>
<div id="root"></div>
<script>
var F=window.Folio,h=React.createElement;
function S(n,e,w){return h('div',{className:'fo-demo__cell',style:w?{gridColumn:'span '+w}:null},h('span',{className:'fo-demo__name'},n),e)}
function G(t,min){var c=[].slice.call(arguments,2);return h('section',{className:'fo-stack'},t&&h('h4',{className:'fo-demo__h'},t),h('div',{className:'fo-demo__grid',style:{'--_min':(min||200)+'px'}},c))}
function R(el){ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'fo fo-demo'},el))}
var subj=['Mathematics','English','Word Building','Science','Social Studies'];
R(h('div',{className:'fo-demo__grid',style:{'--_min':'220px'}},
  S('Select / Default', h(F.Field,{label:'Subject'},h(F.Select,{options:subj,placeholder:'Choose a subject'}))),
  S('Select / Filled', h(F.Field,{label:'Subject'},h(F.Select,{options:subj,defaultValue:'Mathematics'}))),
  S('Select / Error', h(F.Field,{label:'Subject',error:'Choose a subject.'},h(F.Select,{options:subj,placeholder:'Choose a subject'}))),
  S('Select / Disabled', h(F.Field,{label:'Subject'},h(F.Select,{options:subj,defaultValue:'Science',disabled:true})))
));
</script>
</body>
</html>
