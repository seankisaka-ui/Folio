<!-- @dsCard group="Forms" height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ScoreInput — preview</title></head>
<body>
<div id="root"></div>
<script>
var F=window.Folio,h=React.createElement;
function S(n,e,w){return h('div',{className:'fo-demo__cell',style:w?{gridColumn:'span '+w}:null},h('span',{className:'fo-demo__name'},n),e)}
function G(t,min){var c=[].slice.call(arguments,2);return h('section',{className:'fo-stack'},t&&h('h4',{className:'fo-demo__h'},t),h('div',{className:'fo-demo__grid',style:{'--_min':(min||200)+'px'}},c))}
function R(el){ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'fo fo-demo'},el))}
R(h('div',{className:'fo-demo__grid',style:{'--_min':'220px'}},
  S('Input / Score / Default', h(F.Field,{label:'PACE test score'},h(F.ScoreInput,{placeholder:'0–100'}))),
  S('Input / Score / Passed', h(F.Field,{label:'PACE test score',success:'Passed (pass mark 80%)'},h(F.ScoreInput,{defaultValue:'92'}))),
  S('Input / Score / Below pass mark', h(F.Field,{label:'PACE test score',warning:'Below the 80% pass mark'},h(F.ScoreInput,{defaultValue:'74'}))),
  S('Input / Score / Error', h(F.Field,{label:'PACE test score',error:'Enter a score from 0 to 100.'},h(F.ScoreInput,{defaultValue:'109'})))
));
</script>
</body>
</html>
