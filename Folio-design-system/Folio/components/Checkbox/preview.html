<!doctype html>
<html>
<head><meta charset="utf-8"><title>Checkbox — preview</title></head>
<body>
<div id="root"></div>
<script>
var F=window.Folio,h=React.createElement;
function S(n,e,w){return h('div',{className:'fo-demo__cell',style:w?{gridColumn:'span '+w}:null},h('span',{className:'fo-demo__name'},n),e)}
function G(t,min){var c=[].slice.call(arguments,2);return h('section',{className:'fo-stack'},t&&h('h4',{className:'fo-demo__h'},t),h('div',{className:'fo-demo__grid',style:{'--_min':(min||200)+'px'}},c))}
function R(el){ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'fo fo-demo'},el))}
R(h('div',{className:'fo-demo__grid',style:{'--_min':'220px'}},
  S('Checkbox / Unchecked', h(F.Checkbox,{label:'Science'})),
  S('Checkbox / Checked', h(F.Checkbox,{label:'Mathematics',defaultChecked:true})),
  S('Checkbox / Indeterminate', h(F.Checkbox,{label:'All subjects',indeterminate:true})),
  S('Checkbox / Focus', h(F.Checkbox,{label:'English',className:'is-focus',defaultChecked:true})),
  S('Checkbox / Disabled', h(F.Checkbox,{label:'Word Building',disabled:true,description:'Already assigned'})),
  S('Checkbox / Error', h(F.Checkbox,{label:'I checked these scores against the PACE',invalid:true}))
));
</script>
</body>
</html>
