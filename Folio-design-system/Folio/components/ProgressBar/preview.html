<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProgressBar — preview</title></head>
<body>
<div id="root"></div>
<script>
var F=window.Folio,h=React.createElement;
function S(n,e,w){return h('div',{className:'fo-demo__cell',style:w?{gridColumn:'span '+w}:null},h('span',{className:'fo-demo__name'},n),e)}
function G(t,min){var c=[].slice.call(arguments,2);return h('section',{className:'fo-stack'},t&&h('h4',{className:'fo-demo__h'},t),h('div',{className:'fo-demo__grid',style:{'--_min':(min||200)+'px'}},c))}
function R(el){ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'fo fo-demo'},el))}
R(h('div',{className:'fo-demo__grid',style:{'--_min':'260px'}},
  S('Progress / Not started',h(F.ProgressBar,{label:'Pages completed',value:0,max:36,valueText:'0 of 36'})),
  S('Progress / In progress',h(F.ProgressBar,{label:'Pages completed',value:18,max:36,valueText:'18 of 36'})),
  S('Progress / Complete',h(F.ProgressBar,{label:'Pages completed',value:36,max:36,valueText:'36 of 36'})),
  S('Progress / Large',h(F.ProgressBar,{label:'Term progress',value:7,max:12,valueText:'7 of 12 PACEs',size:'lg'}))
));
</script>
</body>
</html>
